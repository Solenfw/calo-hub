[project]
name = "calo-hub-backend"
version = "0.1.0"
description = "Backend API for Calo Hub"
authors = [{ name = "Calo Hub", email = "dev@calohub.example" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.117.0",
    "uvicorn[standard]>=0.24.0",
    "python-dotenv>=1.0.0",
    "SQLAlchemy>=2.0.40",
    "psycopg[binary]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-jose[cryptography]>=3.2.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"