services:
  db:
    image: postgres:17
    container_name: calo_hub_db
    environment:
      POSTGRES_USER: ${GOOSE_USER}
      POSTGRES_PASSWORD: ${GOOSE_PASSWORD}
      POSTGRES_DB: ${GOOSE_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GOOSE_USER} -d ${GOOSE_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ~/.config/secrets/calohub/.env

volumes:
  postgres_data: