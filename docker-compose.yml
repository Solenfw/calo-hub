services:
  db:
    image: postgres:17
    container_name: calo_hub_db
    env_file:
      - ${HOME}/.config/secrets/calohub/.env
    environment:
      POSTGRES_USER: ${GOOSE_USER}
      POSTGRES_PASSWORD: ${GOOSE_PASSWORD}
      POSTGRES_DB: ${GOOSE_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${HOME}/.config/secrets/calohub/.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: